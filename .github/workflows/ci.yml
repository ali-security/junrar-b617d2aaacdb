name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Gradle test selector (e.g. test --tests FooTest); empty runs the full build'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('assemble {0}', inputs.test-filter) || 'build' }}
      - name: Test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for x in sorted(glob.glob('build/test-results/test/*.xml')):
              r = ET.parse(x).getroot()
              for tc in r.iter('testcase'):
                  st = 'PASSED'
                  if tc.find('failure') is not None: st = 'FAILED'
                  elif tc.find('error') is not None: st = 'ERROR'
                  elif tc.find('skipped') is not None:
                      st = 'SKIPPED (' + (tc.find('skipped').get('message') or 'no message') + ')'
                  print(f"{tc.get('classname')} > {tc.get('name')} {st}")
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0)); e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
          print(f"Test summary: {t} tests, {t - f - e - s} passed, {f} failed, {e} errors, {s} skipped")
          PY
      - name: Build release jar
        if: matrix.java == '8'
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jar
      - name: Upload jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: junrar-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport

  release:
    name: semantic release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
